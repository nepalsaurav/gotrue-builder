name: Build supabase/auth and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "supabase/auth tag to build (e.g. v2.196.0)"
        required: true
        default: "v2.196.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone supabase/auth
        run: git clone --branch "${{ inputs.version }}" --depth 1 https://github.com/supabase/auth.git src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build linux/amd64 and linux/arm64
        working-directory: src
        run: |
          mkdir -p ../dist
          COMMIT=$(git rev-parse HEAD)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "-X github.com/supabase/auth/cmd.Version=$COMMIT" \
              -o "../dist/gotrue-auth-linux-$arch" .
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum gotrue-auth-* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"
          NOTES="Prebuilt supabase/auth (GoTrue) binaries for $TAG, cross-compiled from unmodified upstream source via GitHub Actions. Static (CGO_ENABLED=0) linux/amd64 and linux/arm64 binaries."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "supabase/auth $TAG" --notes "$NOTES"
          fi
